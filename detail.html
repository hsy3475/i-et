<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i'et | 상품 상세</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* 상세페이지 전용 스타일 ⭐ 추가 */
      .detail-page {
        padding-block: 48px 88px;
      }

      .detail-wrap {
        max-width: 860px; /* 상세 이미지 폭 */
        margin-inline: auto;
        padding-inline: 24px;
      }

      .detail-title {
        font-size: 1.6rem;
        font-weight: 700;
        color: #ed6618;
        text-align: center;
        margin-bottom: 28px;
      }

      .detail-img {
        display: block; /* img 아래 빈틈 제거 */
        width: 100%;
        height: auto;
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      /* 상세 이미지 없는 제품일 때 */
      .detail-empty {
        padding: 80px 24px;
        border-radius: 22px;
        background: var(--apricot-soft);
        color: var(--ink-soft);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!--=============== gnb (로고만) ================-->
    <div class="nav">
      <div class="wrap nav-row">
        <a class="logo" href="index.html"><img src="logo_white.png" alt="i'et" /></a>
      </div>
    </div>

    <!--=============== 상세 내용 ================-->
    <main class="detail-page">
      <div class="detail-wrap">
        <h1 class="detail-title" id="detail-title">상품 상세</h1>
        <div id="detail-body"></div>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        // 제품 id ➡️ 상세 이미지 연결 (파일명은 실제 이미지 이름으로 바꿔줘!)
        var details = {
          garcinia: {
            name: "Calori-et 가르시니아 900",
            img: "detail.png",
          },
          collagen: { name: "Calori-et 콜라겐 밸런스", img: "" },
          detox: { name: "Calori-et 그린 디톡스", img: "" },
        };

        // 주소창 ?id=garcinia 에서 id 꺼내기
        var id = new URLSearchParams(location.search).get("id");
        var item = details[id];
        var titleEl = document.getElementById("detail-title");
        var bodyEl = document.getElementById("detail-body");

        if (!item) {
          titleEl.textContent = "상품을 찾을 수 없어요";
          return;
        }

        titleEl.textContent = item.name;
        document.title = "i'et | " + item.name;

        if (item.img) {
          bodyEl.innerHTML =
            '<img class="detail-img" src="' +
            item.img +
            '" alt="' +
            item.name +
            ' 상세페이지" />';
        } else {
          bodyEl.innerHTML =
            '<div class="detail-empty">상세페이지 준비 중이에요 🙏</div>';
        }
      })();
    </script>
  </body>
</html>
